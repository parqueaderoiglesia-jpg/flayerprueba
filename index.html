<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de Flyers Trvely</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&family=Work+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f4f5f4;--txt:#1b2b26;--card:#fff;--bd:#dfe3e1;--acc:#B41241}
@media(prefers-color-scheme:dark){:root{--bg:#141a18;--txt:#e8eeeb;--card:#1e2724;--bd:#33403b}}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,sans-serif;background:var(--bg);color:var(--txt)}
.app{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:18px;padding:16px;max-width:1100px;margin:auto}
@media(max-width:800px){.app{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
h1{font-size:17px;margin:0}h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;opacity:.65}
label{font-size:12px;display:block;margin:6px 0 3px}
input[type=text],input[type=number],select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:inherit;font:inherit;font-size:14px}
textarea{height:60px;font-size:12px}.row{display:flex;gap:8px}.row>*{flex:1}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpls button{padding:10px 6px;border:2px solid var(--bd);border-radius:10px;background:transparent;color:inherit;font:500 13px Montserrat;cursor:pointer}
.tpls button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:4px}.chk label{display:flex;gap:6px;margin:0;align-items:center}
.bank{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.bank button{height:60px;border:2px solid transparent;border-radius:8px;cursor:pointer;color:#fff;font:600 10px Montserrat;text-shadow:0 1px 3px #000;display:flex;align-items:flex-end;padding:3px;text-align:left;background-size:cover;background-position:center}
.bank button.on{border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font:700 14px Montserrat;cursor:pointer}
.btn.s{background:transparent;color:inherit;border:1px solid var(--bd);padding:8px;font-size:12px;margin-top:6px}
.view{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;align-items:center;gap:10px}
.wrap{width:360px;height:640px;max-width:100%;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#badge{font-size:12px;opacity:.7}
/* ===== FLYER 900x1600 ===== */
#flyer{--vino:#B41241;--verde:#0B5E56;--panel:#EFEEE9;--ft:'Bebas Neue';--ftw:400;--fx:Montserrat;width:900px;height:1600px;position:relative;overflow:hidden;transform-origin:top left;background:linear-gradient(#2b8fe0,#bfe3f7 60%,#3fc2d6)}
#flyer>*{position:absolute;display:none}
#foto{display:block!important;inset:0;background-size:cover;background-position:center}
#flyer>#stack{display:flex;left:0;bottom:28px;width:900px;padding:0 40px;flex-direction:column;align-items:center;gap:8px;text-align:center}
#flyer #stack>*{width:auto;max-width:100%;position:static;left:auto}
#flyer #stack>#inc{flex-wrap:wrap;justify-content:center;gap:8px}
#lgT{font:700 50px Montserrat;color:#fff;letter-spacing:-2px}#lgT img{height:56px}
#hotel,#camp{font:700 34px/1 'Bebas Neue';text-transform:uppercase;color:#fff}
#hotel img,#camp img{max-height:90px;max-width:330px}
#lema{font:500 38px Montserrat;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#dest{font:400 150px/1 'Bebas Neue';text-transform:uppercase;white-space:nowrap;letter-spacing:-.005em}
#dur,#precio{white-space:nowrap;text-transform:uppercase;font-weight:700}
#dur{font-size:32px}#precio{font-size:50px}
#sub,#nota,#salida,#itin,#fecha{font:600 28px/1.2 'Bebas Neue';text-transform:uppercase}
#sello{font:400 40px/.95 'Bebas Neue';text-transform:uppercase;text-align:center}
#pill{font-size:56px;white-space:nowrap}
#inc{display:flex}.it{width:96px;text-align:center;font:500 15px/1.1 Montserrat}
.it svg{width:58px;height:58px;stroke:var(--vino);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 6px;background:#f9e6da;border-radius:50%;padding:9px}
#tag{font:600 28px Montserrat;color:var(--vino)}#legal{font:400 15px/1.25 Montserrat;color:#555}
#sticker{object-fit:contain;object-position:right bottom}
#flyer #dest,#flyer #dur,#flyer #precio,#flyer #pill,#flyer #sello,#flyer #fecha,#flyer #salida,#flyer #itin,#flyer #nota,#flyer #sub,#flyer #hotel,#flyer #camp{font-family:var(--ft)}
#flyer #dest{font-weight:var(--ftw)}
#flyer #lema,#flyer .it,#flyer #legal,#flyer #tag{font-family:var(--fx)}
/* t1 Estándar (nubes) */
.t1 #top{left:0;top:0;width:900px;height:240px}.t1 #bot{left:0;bottom:0;width:900px;height:450px}
.t1 #lgT{left:22px;top:26px}.t1 #hotel{right:20px;top:24px;text-align:right}
#flyer.t1>#stack{bottom:50px}
.t1 #lema{order:1;color:#6c6c6c;font-weight:500;text-shadow:0 0 8px #fff,0 0 3px #fff}
.t1 #dest{order:2;color:var(--vino)}.t1 #dur{order:3;color:var(--verde)}.t1 #precio{order:4;color:var(--verde)}.t1 #inc{order:5}.t1 .it{color:#555}.t1 #legal{order:6}
.t1 #palmas{left:48px;bottom:200px;width:112px;opacity:.5}.t1 #sticker{right:12px;bottom:140px;width:200px;height:240px}
.t1 #sello{left:105px;bottom:490px;width:150px;padding:14px 12px;background:#f1f1f1;color:var(--vino);border-radius:60px 60px 60px 8px;font-size:42px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
/* t2 Oferta */
.t2 #gr{left:0;top:780px;width:900px;height:820px;background:linear-gradient(transparent,var(--panel) 38%)}
.t2 #lgT{left:30px;top:30px}.t2 #camp{left:30px;top:100px;max-width:300px}.t2 #hotel{right:30px;top:40px;text-align:right}
.t2 #sello{right:30px;bottom:720px;background:var(--vino);color:#fff;padding:12px 48px;transform:skewX(-8deg);font-size:46px}
.t2 #lema{order:1;color:var(--vino);text-shadow:none;font-weight:600}.t2 #dest{order:2;color:#b99a6b}.t2 #dur{order:3;color:#333}.t2 #precio{order:4;color:var(--verde)}.t2 #inc{order:5}.t2 .it{color:#444}.t2 #fecha{order:6;color:var(--verde);font-size:40px}.t2 #tag{order:7}.t2 #legal{order:8}
/* t3 Itinerario */
.t3 #gr{left:0;top:800px;width:900px;height:800px;background:linear-gradient(transparent,#fff 40%)}
.t3 #camp{left:24px;top:30px}.t3 #lgT{right:30px;top:36px;font-size:36px}
.t3 #lema{order:1;background:var(--panel);color:var(--vino);text-shadow:none;font-size:20px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;padding:4px 30px}
.t3 #dest{order:2;color:var(--verde)}.t3 #dur{order:3;color:#333}.t3 #salida{order:4;color:#222}.t3 #itin{order:5;color:#222;font-size:26px}.t3 #precio{order:6;color:var(--verde)}.t3 #nota{order:7;color:#111;font-size:24px}.t3 #inc{order:8}.t3 .it{color:#555;font-size:13px}.t3 #tag{order:9;font-size:24px}.t3 #legal{order:10}
/* t4 Promo */
.t4 #gr{left:0;top:1000px;width:900px;height:600px;background:linear-gradient(transparent,#ff7a18 35%,#c4175a 72%,var(--vino))}
.t4 #hotel{left:36px;top:50px}.t4 #camp{right:30px;top:50px;text-align:right}.t4 #lgT{left:36px;bottom:34px;font-size:40px}
.t4 #sello{left:175px;top:540px;width:220px;height:200px;border-radius:50%;background:#fff;color:var(--vino);display:flex!important;align-items:center;justify-content:center;transform:rotate(-12deg);font-size:54px;border:3px dotted var(--vino);padding:20px}
.t4 #pill{left:420px;top:610px;background:var(--vino);color:#fff;padding:6px 26px;border-radius:14px;transform:rotate(-3deg)}
.t4 #sub{left:440px;top:690px;background:#fff;color:var(--vino);padding:0 12px;font-size:22px;transform:rotate(-3deg)}
.t4 #lema{order:1;background:#fff;color:var(--vino);text-shadow:none;font-size:17px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:2px 20px}.t4 #dest{order:2;color:#fff}.t4 #dur{order:3;color:#fff;letter-spacing:.08em}.t4 #inc{order:4}.t4 .it{color:#fff;font-size:11px}.t4 .it svg{background:#fff}.t4 #legal{order:5;color:#fff;font-size:13px;width:620px;align-self:flex-end;text-align:left}
.t4 #sticker{right:20px;bottom:420px;width:280px;height:280px}
#flyer .off{display:none!important}
</style></head><body>
<div class="app">
<div class="panel">
 <h1>Generador de flyers Trvely</h1><div id="badge"></div>
 <div><h2>Diseño</h2><div class="tpls" id="tpls"></div></div>
 <div><h2>Destino y plan</h2>
  <label>Destino</label><input type="text" id="destino" list="dlDest" autocomplete="off" value="Santa Marta"><datalist id="dlDest"></datalist>
  <label>Frase superior</label><input type="text" id="lema_in" value="Atrévete a vivir">
  <div data-f="hotel"><label>Hotel (se muestra su logo si está en la carpeta)</label><input type="text" id="hotelTxt" list="dlHot" autocomplete="off" value="Tamacá Beach Resort Hotel"><datalist id="dlHot"></datalist></div>
  <div data-f="camp"><label>Campaña / etiqueta</label><input type="text" id="campTxt" value="Rumbo a un nuevo año"></div>
  <div class="row"><div><label>Días</label><input type="number" id="dias" value="4"></div><div><label>Noches</label><input type="number" id="noches" value="3"></div></div>
  <div class="row"><div><label>Moneda</label><select id="mon"><option>$</option><option>USD</option></select></div><div><label>Valor</label><input type="number" id="precio_in" value="2159900"></div></div>
  <label>Tarifa</label><select id="tar"><option>Valor por persona</option><option>Valor por 2 personas</option></select>
  <div data-f="sello"><label>Sello (déjalo vacío para ocultarlo)</label><input type="text" id="selloTxt" value="Solo por hoy"></div>
  <div data-f="fecha"><label>Fecha de viaje</label><input type="text" id="fechaTxt" value="Viaja del 13 al 16 de diciembre"></div>
  <div data-f="salida"><label>Salida desde</label><input type="text" id="salTxt" value="Bogotá"></div>
  <div data-f="itin"><label>Itinerario (ciudades)</label><textarea id="itinTxt">Madrid - San Sebastian - Burdeos - Paris - Dijon - Zurich</textarea></div>
  <div data-f="nota"><label>Nota de tarifa</label><input type="text" id="notaTxt" value="Tarifa en acomodación doble o triple por persona"></div>
 </div>
 <div><h2>Incluye</h2><div class="chk" id="incChk"></div></div>
 <div><h2>Banco de imágenes</h2><input type="text" id="q" placeholder="Buscar: playa, Cartagena, ciudad..."><div class="bank" id="bank"></div>
  <label>O sube tu propia foto</label><input type="file" id="up" accept="image/*">
  <div class="row"><div><label>Zoom</label><input type="range" id="zoom" min="100" max="200" value="100"></div><div><label>Posición</label><input type="range" id="px" min="0" max="100" value="50"></div></div></div>
 <div><h2>Mascota</h2><select id="stk"></select></div>
 <div><h2>Marca</h2>
  <div class="row"><div><label>Título</label><input type="color" id="c1" value="#B41241"></div><div><label>Nube</label><input type="color" id="c2" value="#0B5E56"></div><div><label>Panel</label><input type="color" id="c3" value="#EFEEE9"></div></div>
  <button type="button" class="btn s" id="rc">Volver a colores de marca</button>
  <label>Tipografía de títulos y precio</label><select id="fTit"></select>
  <label>Tipografía de textos</label><select id="fTxt"></select></div>
 <div><label>Texto legal</label><textarea id="legalIn">Trvely SAS (RNT 232640) esta registrado ante el ministerio de Comercio, industria y turismo. Las tarifas y promociones están sujetos a disponibilidad y cambios sin previo aviso. Los menores deben viajar con un padre o tutor legal, cumpliendo con los requisitos legales. El manejo de datos personales cumple con la ley 1581 de 2012. LEY 679 2001, apoyamos la protección de la ESCNNA.</textarea></div>
</div>
<div class="view"><div class="wrap"><div id="flyer">
 <div id="foto"></div><div id="gr"></div>
 <svg id="top" viewBox="0 0 900 240" preserveAspectRatio="none"><g id="g1" fill="#0B5E56"><rect width="900" height="130"/><circle cx="260" cy="130" r="70"/><circle cx="360" cy="120" r="75"/><circle cx="600" cy="120" r="90"/><circle cx="740" cy="110" r="95"/><circle cx="860" cy="90" r="70"/></g></svg>
 <svg id="bot" viewBox="0 0 900 450" preserveAspectRatio="none"><g id="g2" fill="#EFEEE9"><rect y="90" width="900" height="360"/><circle cx="80" cy="110" r="90"/><circle cx="220" cy="85" r="70"/><circle cx="390" cy="75" r="80"/><circle cx="560" cy="80" r="70"/><circle cx="720" cy="75" r="85"/><circle cx="860" cy="100" r="80"/></g></svg>
 <div id="lgT"><span>trvely</span></div><div id="hotel"></div><div id="camp"></div><div id="sello"></div><div id="pill"></div><div id="sub"></div>
 <svg id="palmas" viewBox="0 0 100 90" fill="#777"><path d="M30 85 L36 30 L42 30 L40 85Z"/><path d="M38 32C20 20 8 28 4 38 18 28 28 30 38 32ZM38 32C30 10 46 4 56 8 44 12 40 20 38 32ZM38 32C58 22 74 30 78 40 62 30 50 30 38 32Z"/><path d="M70 85 L72 55 L77 55 L76 85Z"/><path d="M74 56C62 48 56 54 54 60 64 54 70 55 74 56ZM74 56C84 46 94 52 96 60 86 54 80 55 74 56Z"/></svg>
 <img id="sticker" alt="">
 <div id="stack"><div id="lema"></div><div id="dest"></div><div id="dur"></div><div id="salida"></div><div id="itin"></div><div id="precio"></div><div id="nota"></div><div id="inc"></div><div id="fecha"></div><div id="tag">Viaja fácil, viaja Trvely</div><div id="legal"></div></div>
</div></div><button class="btn" id="dl" style="width:360px;max-width:100%">Descargar PNG</button></div>
</div>
<script>
/* ===== CONFIGURACIÓN: edita aquí al subir archivos a GitHub ===== */
const LOGO="img/marca/logo-trvely.png";   // logo blanco de Trvely (si no existe se escribe el nombre)
const COLORES={vino:"#B41241",verde:"#0B5E56",panel:"#EFEEE9"};  // vino = Burgundy Travel de la guía; el beige de marca es #F4E5D2
const FUENTES=[{n:"Bebas Neue (como los flyers actuales)",f:"'Bebas Neue'",w:400,s:2},{n:"Montserrat ExtraBold (guía de marca)",f:"Montserrat",w:800,s:0},{n:"Anton",f:"Anton",w:400,s:0},{n:"Work Sans Bold",f:"'Work Sans'",w:700,s:0}];
const TEXTOS=[{n:"Montserrat (guía de marca)",f:"Montserrat"},{n:"Poppins",f:"Poppins"},{n:"Work Sans",f:"'Work Sans'"}];
const BANCO=[
 {n:"Playa y palmera",src:"img/destinos/playa-palmera.jpg",t:"playa palmera caribe santa marta covenas tolu",g:"linear-gradient(#2b8fe0,#bfe3f7 55%,#f3e6c8)"},
 {n:"Playa aérea",src:"img/destinos/playa-aerea.jpg",t:"playa vista aerea santa marta",g:"linear-gradient(#0b7d7a,#5fb5ad 50%,#efd9cc)"},
 {n:"Cartagena ciudad",src:"img/destinos/cartagena-ciudad.jpg",t:"cartagena ciudad amurallada torre reloj",g:"linear-gradient(#cfd8e8,#e8b98a 55%,#7a8a4f)"},
 {n:"Medellín",src:"img/destinos/medellin.jpg",t:"medellin ciudad metro",g:"linear-gradient(#9fc3e8,#e6eef6 50%,#8a9a6a)"},
 {n:"Pareja en playa",src:"img/destinos/pareja-playa.jpg",t:"pareja playa romantico",g:"linear-gradient(#1e6bb8,#9ec9ee 50%,#f6ecdc)"},
 {n:"Europa",src:"img/destinos/europa.jpg",t:"europa ciudad puente budapest",g:"linear-gradient(#b9a2d8,#e9c9c0 50%,#5a5668)"}];
const STICKERS=[
 {n:"Caballito de mar",src:"img/stickers/caballito-mar.png",d:["santa marta","san andrés"]},
 {n:"Pulpo",src:"img/stickers/pulpo.png",d:["cartagena"]},
 {n:"Estrella de mar",src:"img/stickers/estrella-mar.png",d:["coveñas","tolú","montería (tolú y coveñas)"]},
 {n:"Iguana",src:"img/stickers/iguana.png",d:["medellín"]},
 {n:"Tortuga",src:"img/stickers/tortuga.png",d:["santo domingo","punta cana"]},
 {n:"Ninguna",src:"",d:[]}];
const INC={
 vuelos:["Vuelos",'<path d="M4 30l16-4 10-18 5 2-5 16 12-3 4-6 4 1-3 10 3 10-4 1-4-6-12-3 5 16-5 2-10-18-16-4z"/>'],
 traslados:["Traslados",'<path d="M6 28l5-12h22l5 12v8H6z"/><circle cx="14" cy="36" r="3"/><circle cx="30" cy="36" r="3"/>'],
 estadia:["Estadía",'<path d="M6 36V12M6 26h32v10M6 22h12v-6h14a6 6 0 016 6"/>'],
 desayuno:["Desayuno",'<path d="M10 20h20v10a6 6 0 01-6 6h-8a6 6 0 01-6-6zM30 22h4a4 4 0 010 8h-4M14 8c0 4 4 4 4 8M22 8c0 4 4 4 4 8"/>'],
 desayunocena:["Desayuno y Cena",'<path d="M10 20h20v10a6 6 0 01-6 6h-8a6 6 0 01-6-6zM30 22h4a4 4 0 010 8h-4M14 8c0 4 4 4 4 8M22 8c0 4 4 4 4 8"/>'],
 alimentacion:["Alimentación",'<path d="M14 6v12a3 3 0 006 0V6M17 18v20M30 6c-4 3-5 8-5 13h5v19"/>'],
 todo:["Todo incluido",'<path d="M10 20h20v10a6 6 0 01-6 6h-8a6 6 0 01-6-6zM30 22h4a4 4 0 010 8h-4M14 8c0 4 4 4 4 8M22 8c0 4 4 4 4 8"/>'],
 bebidas:["Bebidas y Licores",'<path d="M14 6h12l-2 14a4 4 0 01-8 0zM20 24v12M13 36h14"/>'],
 tour:["Tour",'<path d="M6 24a16 14 0 0132 0zM22 24v14"/>'],
 guia:["Guía turística",'<circle cx="22" cy="14" r="7"/><path d="M10 38c0-9 5-12 12-12s12 3 12 12"/>'],
 asist:["Asistencia Médica",'<rect x="6" y="14" width="32" height="22" rx="4"/><path d="M16 14v-4h12v4M22 20v10M17 25h10"/>'],
 seguro:["Seguro hotelero",'<path d="M22 6l14 5v10c0 9-6 15-14 17C14 36 8 30 8 21V11z"/><path d="M16 22l5 5 8-9"/>'],
 esim:["E-sim",'<rect x="12" y="6" width="20" height="32" rx="3"/><path d="M19 30h6"/>']};
const T={
 t1:{n:"Estándar (nubes)",show:"top bot lgT hotel sello lema dest dur precio inc palmas sticker legal",f:"hotel sello",z:[150,32,50]},
 t2:{n:"Oferta",show:"gr lgT camp hotel sello lema dest dur precio inc fecha tag legal",f:"hotel camp sello fecha",z:[150,32,56]},
 t3:{n:"Itinerario",show:"gr camp lgT lema dest dur salida itin precio nota inc tag legal",f:"camp salida itin nota",z:[120,30,48]},
 t4:{n:"Promo 2x1",show:"gr hotel camp sello pill sub lgT lema dest dur inc sticker legal",f:"hotel camp sello",z:[140,36,50]}};
/* ================================================================ */
const $=i=>document.getElementById(i),v=i=>$(i).value;
let cur="t1",inc=new Set(["vuelos","traslados","estadia","desayuno","tour","asist"]),bg=null,DATOS=null;
function fit1(e,mx){let s=mx;e.style.fontSize=s+"px";while(e.scrollWidth>e.clientWidth+1&&s>26){s-=3;e.style.fontSize=s+"px"}}
function scaleView(){$("flyer").style.transform="scale("+$("flyer").parentElement.clientWidth/900+")"}
function setT(k){cur=k;$("tpls").innerHTML=Object.keys(T).map(x=>`<button data-k="${x}" class="${x==k?"on":""}">${T[x].n}</button>`).join("");render()}
function hotelLogo(n){const h=DATOS&&DATOS.hoteles.find(x=>x.nombre.toLowerCase()==n.trim().toLowerCase());return h&&h.logo}
function render(){
 const f=$("flyer"),tp=T[cur],ft=FUENTES[v("fTit")],fx=TEXTOS[v("fTxt")];f.className=cur;
 const sp=(k,x)=>f.style.setProperty(k,x);sp("--vino",v("c1"));sp("--verde",v("c2"));sp("--panel",v("c3"));sp("--ft",ft.f);sp("--ftw",ft.w);sp("--fx",fx.f);
 $("g1").setAttribute("fill",v("c2"));$("g2").setAttribute("fill",v("c3"));
 [...f.children,...$("stack").children].forEach(e=>{if(e.id=="foto"||e.id=="stack")return;e.style.display=tp.show.split(" ").includes(e.id)?(e.id=="inc"?"flex":"block"):"none"});
 document.querySelectorAll("[data-f]").forEach(e=>e.style.display=tp.f.split(" ").includes(e.dataset.f)?"":"none");
